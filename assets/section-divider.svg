<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="1200" height="28" role="presentation" aria-hidden="true">
  <defs>
    <style>
      @keyframes corePulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.62; }
      }
      .diamond-core { animation: corePulse 3.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>

    <linearGradient id="leftHairline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E2F4D" stop-opacity="0"/>
      <stop offset="48%" stop-color="#1E2F4D" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#8C5A32" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="rightHairline" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1E2F4D" stop-opacity="0"/>
      <stop offset="48%" stop-color="#1E2F4D" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#8C5A32" stop-opacity="0.98"/>
    </linearGradient>

    <radialGradient id="centerAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C89B6E" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C89B6E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Symmetric Gradient Hairlines -->
  <line x1="24" y1="14" x2="564" y2="14" stroke="url(#leftHairline)" stroke-width="1.25" stroke-linecap="round"/>
  <line x1="636" y1="14" x2="1176" y2="14" stroke="url(#rightHairline)" stroke-width="1.25" stroke-linecap="round"/>

  <!-- Subtle Center Glow -->
  <ellipse cx="600" cy="14" rx="34" ry="12" fill="url(#centerAmbient)"/>

  <!-- Flanking Sapphire Micro-Nodes -->
  <circle cx="554" cy="14" r="1.4" fill="#6E96C4" fill-opacity="0.55"/>
  <circle cx="574" cy="14" r="2.2" fill="#6E96C4"/>
  <line x1="581" y1="14" x2="587" y2="14" stroke="#8C5A32" stroke-width="1.2"/>

  <line x1="613" y1="14" x2="619" y2="14" stroke="#8C5A32" stroke-width="1.2"/>
  <circle cx="626" cy="14" r="2.2" fill="#6E96C4"/>
  <circle cx="646" cy="14" r="1.4" fill="#6E96C4" fill-opacity="0.55"/>

  <!-- Centered Geometric Bronze Diamond (#8C5A32 Outer, #C89B6E Core) -->
  <polygon points="600,3.5 610.5,14 600,24.5 589.5,14" fill="#1E1612" stroke="#8C5A32" stroke-width="1.25" stroke-linejoin="round"/>
  <polygon points="600,8.8 605.2,14 600,19.2 594.8,14" fill="#C89B6E" class="diamond-core"/>
</svg>
