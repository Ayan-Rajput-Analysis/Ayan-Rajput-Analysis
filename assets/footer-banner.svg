<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 136" width="1200" height="136" role="img" aria-labelledby="footerTitle footerDesc">
  <title id="footerTitle">Ayan Rajput — Executive Portfolio Footer &amp; Contact</title>
  <desc id="footerDesc">Engineered with mathematical rigor and architectural precision. Open to full-time engineering roles, AI consulting, and high-impact client builds.</desc>

  <defs>
    <style>
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      @keyframes statusPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.40; }
      }
      @keyframes topHighlightBreath {
        0%, 100% { opacity: 0.96; }
        50% { opacity: 0.65; }
      }
      .pulse-dot { animation: statusPulse 2.8s ease-in-out infinite; }
      .top-highlight { animation: topHighlightBreath 4.5s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>

    <clipPath id="footerClip">
      <rect x="0.5" y="0.5" width="1199" height="135" rx="12"/>
    </clipPath>

    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1E1612"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>

    <linearGradient id="topCenterHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B132B" stop-opacity="0"/>
      <stop offset="24%" stop-color="#8C5A32" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#C89B6E" stop-opacity="1"/>
      <stop offset="76%" stop-color="#8C5A32" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="footerCenterGlow" cx="50%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#C89B6E" stop-opacity="0.14"/>
      <stop offset="65%" stop-color="#8C5A32" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0"/>
    </radialGradient>

    <pattern id="footerGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E2F4D" stroke-width="0.65" stroke-opacity="0.24"/>
    </pattern>
  </defs>

  <!-- Clipped Canvas Layer -->
  <g clip-path="url(#footerClip)">
    <rect x="0.5" y="0.5" width="1199" height="135" rx="12" fill="url(#footerBg)"/>
    <rect x="0" y="0" width="1200" height="136" fill="url(#footerGrid)"/>
    <rect x="0" y="0" width="1200" height="136" fill="url(#footerCenterGlow)"/>

    <!-- Top Center #C89B6E Highlight Line -->
    <rect x="180" y="0.5" width="840" height="2" fill="url(#topCenterHighlight)" class="top-highlight"/>
  </g>

  <!-- Crisp Outer Border -->
  <rect x="0.5" y="0.5" width="1199" height="135" rx="12" fill="none" stroke="#1E2F4D" stroke-width="1"/>

  <!-- Subtle Flanking Corner Micro-Accents -->
  <circle cx="36" cy="68" r="2.2" fill="#8C5A32" fill-opacity="0.65"/>
  <circle cx="1164" cy="68" r="2.2" fill="#3D8B6E" class="pulse-dot"/>

  <!-- Centered Typography Stack -->
  <text x="600" y="38" text-anchor="middle" class="mono" font-size="11" font-weight="600" letter-spacing="2" fill="#C89B6E">ENGINEERED WITH MATHEMATICAL RIGOR &amp; ARCHITECTURAL PRECISION</text>

  <text x="600" y="74" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#F1F5F9">Ayan Rajput  <tspan fill="#C89B6E">•</tspan>  AI &amp; Deep Learning  <tspan fill="#6E96C4">|</tspan>  3D WebGL  <tspan fill="#6E96C4">|</tspan>  Full-Stack &amp; Enterprise BI</text>

  <text x="600" y="106" text-anchor="middle" class="sans" font-size="12.5" font-weight="400" fill="#94A3B8">Open to Full-Time Engineering Roles, AI Consulting &amp; High-Impact Client Builds  •  <tspan fill="#CBD5E1" font-weight="500">ayanrajput779900@gmail.com</tspan></text>
</svg>
